# Build, mede e publica o PianoForge para Linux, Windows e macOS.
#
# Ha um formato de plugin: VST3. Nenhuma das tres maquinas de CI tem um DAW, uma
# placa de audio ou um soundfont de terceiros, entao cada prova abaixo vem das
# ferramentas do proprio repo (tools/), que encostam no plugin por
# dlopen/GetPluginFactory e medem audio no offline:
#
#   A  --pedalload    -- gate duro: nota muda com o pedal no ar = retorno != 0
#   B  standalone     -- renderiza WAV com o banco sintetico e confere pico/teto
#   C  vst3_probe --ui -- no Linux sob Xvfb: o painel pinta dentro de um X11
#   C2 vst3_probe --ui -- no Windows: o painel pinta dentro de um HWND
#   D  ui_preview     -- offscreen nos tres: o painel continua desenhando
#   E  vst3_probe     -- fabrica, 17 parametros, estado ida-e-volta, audio
#   F  pluginval      -- binario de terceiro, quando ele roda no runner (nao gate)
#
# Sem soundfont no repositorio (licenca) nem no runner: os bancos sao gerados por
# tools/SynthBank.hpp na hora. O que so banco gravado prova (martelo, feltro,
# ressonancia) continua sendo conferido a ouvido, nao aqui.

name: build-and-release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: linux-x64
            os: ubuntu-latest
            pkg: tar.gz
            pvzip: pluginval_Linux.zip
          - slug: windows-x64
            os: windows-latest
            pkg: zip
            pvzip: pluginval_Windows.zip
          # universal porque o mesmo painel tem de chegar aos dois chips, e o
          # backend Cocoa nao usa API acima de 10.12 (deployment target 11.0 no
          # CMakeLists). Os testes rodam no arch nativo do runner.
          - slug: macos-universal
            os: macos-latest
            pkg: tar.gz
            pvzip: pluginval_macOS.zip

    defaults:
      run:
        shell: bash

    steps:
      # Nada de `submodules: recursive`: tsf.h, miniz e stb estao vendorizados no
      # repo justamente para o build nao depender de rede (o SDK do VST3 e a unica
      # dependencia buscada por script).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libX11 + libXext: o backend X11 do painel (MIT-SHM).
          # xvfb: a unica forma de abrir a UI de verdade num runner sem tela.
          sudo apt-get install -y --no-install-recommends libx11-dev libxext-dev xvfb

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # O SDK do VST3 nao e vendorizado: sao ~40 MB de cabecalho e helper que o
      # historico nao precisa carregar (a licenca dele e MIT desde a serie 3.8, entao
      # o binario sai MIT junto -- ver NOTICE). O script abaixo e o mesmo que a
      # maquina de desenvolvimento usa, entao CI e local compilam a MESMA tag -- sem
      # cache, porque a tag mora no script e um cache velho viraria outro SDK.
      - name: VST3 SDK
        run: bash scripts/get_vst3sdk.sh

      - name: Configure
        if: runner.os != 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS, universal)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64'

      # O configure tem de dizer o que entrou: sfizz e opcional e nenhum runner o
      # tem, entao o artefato de CI e um SF2/.pforge completo sem SFZ. Se um dia
      # aparecer "sfizz: ..." aqui, foi porque o runner passou a ter a lib.
      - name: Build
        run: bash scripts/ci_run.sh build cmake --build build --config Release -j 3

      # No Windows todo binario sai com ".exe", e `./build/pforge_vst3_probe` nao e o
      # mesmo caminho. Pior: o gerador do Visual Studio (o default no runner Windows)
      # e multi-config e poe tudo em build/Release/, nao em build/.
      #
      # Os candidatos sao listados um por um de proposito: `find -maxdepth` e extensao
      # do GNU find e o find do macOS e BSD (falha com "unknown primary"), e `| head`
      # fecha o pipe antes do fim e com pipefail devolve 141 num build que estava bom.
      - name: Caminhos dos executaveis
        run: |
          for t in pforge_dsp_stages pforge_standalone pforge_ui_preview pforge_vst3_probe; do
            exe=""
            for cand in "build/$t" "build/$t.exe" "build/Release/$t" "build/Release/$t.exe"; do
              if [ -f "$cand" ]; then exe="$cand"; break; fi
            done
            if [ -z "$exe" ]; then
              echo "o executavel $t nao foi construido"; exit 1
            fi
            echo "EXE_$t=$exe" >> "$GITHUB_ENV"
          done
          # O bundle .vst3 e uma PASTA, e onde ela cai depende do gerador que o
          # CMake escolheu (Ninja/Make: build/vst3; Visual Studio: build/Release/vst3).
          VST3=""
          for cand in build/vst3/PianoForge.vst3 build/Release/vst3/PianoForge.vst3; do
            if [ -d "$cand" ]; then VST3="$cand"; break; fi
          done
          [ -n "$VST3" ] || { echo "o bundle PianoForge.vst3 nao foi montado"; exit 1; }
          echo "VST3=$VST3" >> "$GITHUB_ENV"

      # Os passos que gateiam rodam por scripts/ci_run.sh: ele guarda a saida e, se o
      # comando reprovar, republica as linhas de erro como anotacao. Nao e enfeite --
      # sem isso a falha de um repo publico e so "exit code 1", porque o log do job
      # exige login ate para ler (a API responde 403 para quem nao esta logado).
      - name: "A: nenhuma tecla muda com o pedal no ar"
        run: |
          bash scripts/ci_run.sh a "$EXE_pforge_dsp_stages" --makesf2 1 --pedalload \
            --seconds 20

      # O teste A acima e o unico que nao depende de medida diferencial de audio, e
      # por isso o unico gate de "nota descartada". Aqui a pergunta e outra: o
      # engine inteiro, do bank ao master, produz amostra nao-nula e nao satura.
      - name: "B: render offline com o banco sintetico"
        run: |
          # Sem `| head`: o step roda com pipefail, e um head que fecha o pipe
          # antes do fim da saida devolve 141 e reprova um build que estava bom.
          "$EXE_pforge_dsp_stages" --makesf2 1 --sf2 synth0.sf2 --regions
          "$EXE_pforge_standalone" --bank synth0.sf2 --feed "c4:250 e4:250 g4:250 -" \
            --out render.wav | tee render.log
          test -s render.wav
          grep -E 'Teto cheio:  *0 amostras' render.log
          awk '/Pico maximo/ { if ($3 + 0 < 0.01) { print "render saiu mudo: " $0; exit 1 } }' render.log

      # Xvfb para o painel chegar como X11 de verdade ao backend do Linux, do mesmo
      # jeito que um host o entregaria em attached().
      - name: "C: o painel pinta dentro de um X11 (Xvfb)"
        if: runner.os == 'Linux'
        run: |
          # Xvfb em vez de xvfb-run: unicos requisitos sao o binario e um socket.
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          XVFB=$!
          for _ in $(seq 25); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
          export DISPLAY=:99
          "$EXE_pforge_vst3_probe" "$VST3" --work vst3probe_ui --ui
          RC=$?
          kill "$XVFB" 2>/dev/null || true
          exit $RC

      # No Windows o container e um HWND de verdade, entao nao ha servidor grafico
      # para levantar. No macOS o painel e uma NSView e a sessao do runner nao
      # garante window server: e o unico backend sem prova de UI em CI.
      - name: "C2: o mesmo painel dentro de um HWND (Windows)"
        if: runner.os == 'Windows'
        run: |
          bash scripts/ci_run.sh c2 "$EXE_pforge_vst3_probe" "$VST3" \
            --work vst3probe_ui --ui

      - name: "D: preview offscreen do painel"
        run: |
          "$EXE_pforge_ui_preview" --state normal --status ready --presets 2 --preset 1 \
            --out painel.ppm
          test -s painel.ppm
          # A aba MOTOR tem layout proprio (sete discos numa grade 4x2 dentro de
          # uma chapa so). Se ela quebrar, tem de quebrar aqui -- e nao na janela
          # de quem clicou na aba.
          "$EXE_pforge_ui_preview" --page 1 --status ready --out motor.ppm
          test -s motor.ppm

      # O plugin abre mudo por decisao do produto; a prova de audio do VST3 e
      # entregar um estado que aponta para um banco sintetico e esperar amostra
      # nao-nula. O banco e gerado aqui, nada vem gravado.
      - name: "E: o VST3 responde a um host de verdade"
        run: |
          bash scripts/ci_run.sh e "$EXE_pforge_vst3_probe" "$VST3" --work vst3probe

      # pluginval e um host de terceiro e julga o que o nosso probe nao julga
      # (thread-safety, layout de barramento, automacao sem gesto). Ele NAO e
      # gate: um binario baixado da rede, rodando num runner sem placa de audio,
      # nao pode reprovar um build que as provas acima aprovaram. A saida fica
      # no log de qualquer forma, e "FAILED" ali e bug de verdade.
      - name: "F: pluginval (informativo)"
        continue-on-error: true
        run: |
          mkdir -p pv
          if ! curl -fsSL -o pv.zip \
              "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/${{ matrix.pvzip }}"; then
            echo "pluginval: nao baixou (sem rede?); nada a fazer aqui"
            exit 0
          fi
          ( cd pv && cmake -E tar xf ../pv.zip )
          chmod -R +x pv 2>/dev/null || true
          # Candidatos um por um: `find -maxdepth` nao existe no find do macOS, e o
          # zip do macOS traz o binario dentro do .app.
          PV=""
          for cand in pv/pluginval pv/pluginval.exe pv/pluginval.app/Contents/MacOS/pluginval; do
            if [ -f "$cand" ]; then PV="$cand"; break; fi
          done
          if [ -z "$PV" ]; then echo "pluginval: binario nao achado no zip"; exit 0; fi
          if [ '${{ runner.os }}' = 'Linux' ]; then
            # mesmo truque do passo D: o pluginval e um app JUCE e quer um display
            Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
            XVFB=$!
            for _ in $(seq 25); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
            export DISPLAY=:99
          fi
          if [ '${{ runner.os }}' = 'macOS' ]; then
            # binario vindo da rede carrega a quarentena do Gatekeeper
            xattr -dr com.apple.quarantine pv 2>/dev/null || true
          fi
          "$PV" --strictness-level 5 --skip-gui-tests --output-dir pluginval-out \
            --validate "$VST3" || true
          # o veredito fica no log; o --skip-gui-tests e porque a UI ja tem o
          # passo C e C2, e abrir editor num runner sem tela nao prova nada novo
          grep -rhiE 'FAILED|ALL TESTS PASSED' pluginval-out 2>/dev/null | tail -40 || true

      - name: Empacota
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION="ci-$(git rev-parse --short HEAD)" ;; esac
          NAME="pianoforge-${VERSION}-${{ matrix.slug }}"
          mkdir -p dist/"$NAME"
          # Antes de copiar: o painel nao desenha uma letra quando nao acha as fontes,
          # e o sintoma que chega ao usuario e "o plugin abriu vazio", nao um erro de
          # instalacao. Foi o que aconteceu com um .vst3 copiado como ARQUIVO SOLTO,
          # fora do bundle e sem o Contents/Resources ao lado. O pacote publicado nao
          # pode ter essa forma, entao a fonte ausente aborta aqui e nao na maquina
          # de quem baixou.
          FONTES="DejaVuSans.ttf DejaVuSans-Bold.ttf DejaVuSerif.ttf DejaVuSansMono.ttf"
          for f in $FONTES; do
            if [ ! -f "$VST3/Contents/Resources/$f" ]; then
              echo "::error::sem $f no bundle: o painel abriria sem texto neste pacote"
              exit 1
            fi
          done
          # O pacote leva o bundle e o standalone. Nao ha segundo formato: o mesmo
          # .vst3 abre em REAPER/Cubase/Bitwig/Studio One nos tres sistemas.
          cp -r "$VST3" dist/"$NAME"/
          # O standalone e o unico binario do pacote que roda sem host; o caminho vem
          # do step "Caminhos dos executaveis" (no Windows/VS ele esta em build/Release).
          cp "$EXE_pforge_standalone" dist/"$NAME"/
          cp LICENSE NOTICE README.md dist/"$NAME"/
          # A captura do painel entra no pacote (mesmo caminho do README) e e o que
          # a pagina da release mostra: o usuario ve o plugin antes de instalar.
          mkdir -p dist/"$NAME"/docs/images
          cp docs/images/pianoforge-painel.png dist/"$NAME"/docs/images/
          cd dist
          if [ '${{ matrix.pkg }}' = 'tar.gz' ]; then
            tar -czf "$NAME.tar.gz" "$NAME"
          else
            # cmake -E tar usa libarchive: mesmo zip nos tres sistemas, sem
            # depender de 7z/zip que nem todo runner traz.
            cmake -E tar cf "$NAME.zip" --format=zip -- "$NAME"
          fi
          cd ..
          echo "ASSET=dist/$NAME.${{ matrix.pkg }}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: pianoforge-${{ matrix.slug }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publica a release
    needs: build
    runs-on: ubuntu-latest
    # So tag publica. Em push de branch/PR o job de build roda e este nem aparece.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: baixados

      - name: Cria a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          find baixados -type f | tee arquivos.txt
          mapfile -a FILES < arquivos.txt
          # Aspas SIMPLES na nota: dentro de "..." o bash comecaria a interpretar
          # crase como comando, e o \` que resolvia isso nao e escape valido de YAML.
          gh release create "$TAG" "${FILES[@]}" \
            --title "PianoForge $TAG" \
            --notes 'Um formato, tres sistemas: instale `PianoForge.vst3` em `~/.vst3` (Linux), `~/Library/Audio/Plug-Ins/VST3` (macOS) ou `%LOCALAPPDATA%\Programs\Common\VST3` (Windows). O plugin abre mudo por decisao: registre seus soundfonts no painel e escolha um. Nada de soundfont vem junto -- questao de licenca, nao de espaco. A captura do painel vai no pacote em `docs/images/pianoforge-painel.png`. Licenca: MIT -- o SDK do VST3 e MIT desde a serie 3.8; ver `NOTICE`.'
